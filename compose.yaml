# Ambiente local de desenvolvimento. Nao usar em producao. Portas somente em loopback.
name: controlid-hub

x-migrator: &migrator
  build:
    context: .
    dockerfile: infra/docker/dotnet.Dockerfile
    args: { PROJECT: Platform.Migrator, BASE: aspnet }
  image: controlid-hub/migrator:dev

services:
  postgres:
    image: postgres:16-alpine@sha256:aa6cb33cf4c19c765cefcf48d96176258800870a9a1e930ad126200f9d825139
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?defina em .env}
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 30

  # KMS de desenvolvimento: OpenBao em modo dev guarda tudo em memoria e perde as chaves ao reiniciar.
  kms:
    image: openbao/openbao:2@sha256:5046911075e137e154ce49ab051502f4ec7cf367d484ae4a4dce665d9b90561f
    command: ["server", "-dev", "-dev-listen-address=0.0.0.0:8200"]
    environment:
      BAO_DEV_ROOT_TOKEN_ID: ${HUB_KMS_DEV_TOKEN:?defina em .env}
    healthcheck:
      test: ["CMD-SHELL", "BAO_ADDR=http://127.0.0.1:8200 bao status"]
      interval: 3s
      timeout: 3s
      retries: 30

  kms-init:
    image: openbao/openbao:2@sha256:5046911075e137e154ce49ab051502f4ec7cf367d484ae4a4dce665d9b90561f
    command: ["secrets", "enable", "transit"]
    depends_on: { kms: { condition: service_healthy } }
    restart: "no"
    environment:
      BAO_ADDR: http://kms:8200
      BAO_TOKEN: ${HUB_KMS_DEV_TOKEN}

  object-storage:
    image: rustfs/rustfs:latest@sha256:ed9210d6411d77ffceb70d94b964a3cb7d225983368bc25bebe01e995293dcc2
    environment:
      RUSTFS_ACCESS_KEY: ${HUB_S3_ACCESS_KEY:?defina em .env}
      RUSTFS_SECRET_KEY: ${HUB_S3_SECRET_KEY:?defina em .env}
    volumes: [s3data:/data]

  db-bootstrap:
    <<: *migrator
    command: ["bootstrap"]
    depends_on: { postgres: { condition: service_healthy } }
    restart: "no"
    environment:
      HUB_ADMIN_CONNECTION: Host=postgres;Username=postgres;Password=${POSTGRES_SUPERUSER_PASSWORD};GSS Encryption Mode=Disable
      HUB_PASSWORD_MIGRATION_OWNER: ${HUB_PASSWORD_MIGRATION_OWNER:?defina em .env}
      HUB_PASSWORD_APP_API: ${HUB_PASSWORD_APP_API:?defina em .env}
      HUB_PASSWORD_WORKER_SYNC: ${HUB_PASSWORD_WORKER_SYNC:?defina em .env}
      HUB_PASSWORD_WORKER_IMPORT: ${HUB_PASSWORD_WORKER_IMPORT:?defina em .env}

  db-migrate:
    <<: *migrator
    command: ["migrate"]
    depends_on: { db-bootstrap: { condition: service_completed_successfully } }
    restart: "no"
    environment:
      HUB_MIGRATOR_CONNECTION: Host=postgres;Database=hub;Username=migration_owner;Password=${HUB_PASSWORD_MIGRATION_OWNER};GSS Encryption Mode=Disable

  api:
    build:
      context: .
      dockerfile: infra/docker/dotnet.Dockerfile
      args: { PROJECT: Platform.Api, BASE: aspnet }
    image: controlid-hub/api:dev
    depends_on:
      db-migrate: { condition: service_completed_successfully }
      kms-init: { condition: service_completed_successfully }
      object-storage: { condition: service_started }
    ports: ["127.0.0.1:8080:8080"]
    healthcheck:
      # A imagem nao traz curl; bash abre o socket e confere o status de /health/ready.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 200 '"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 5s
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Hub: Host=postgres;Database=hub;Username=app_api;Password=${HUB_PASSWORD_APP_API};GSS Encryption Mode=Disable
      # Vazio mantem a API fechada: ninguem autentica ate um provedor OIDC ser configurado.
      Oidc__Authority: ${OIDC_AUTHORITY:-}
      Oidc__ClientId: ${OIDC_CLIENT_ID:-}
      Oidc__ClientSecret: ${OIDC_CLIENT_SECRET:-}
      Oidc__TenantClaim: ${OIDC_TENANT_CLAIM:-tenant}
      Kms__Address: http://kms:8200
      Kms__Token: ${HUB_KMS_DEV_TOKEN}
      Storage__ServiceUrl: http://object-storage:9000
      Storage__Bucket: hub-dev
      Storage__AccessKey: ${HUB_S3_ACCESS_KEY}
      Storage__SecretKey: ${HUB_S3_SECRET_KEY}
      Storage__CreateBucketIfMissing: "true"

  # Antivirus opcional: baixa as assinaturas ao subir e demora alguns minutos para ficar pronto.
  scanner:
    profiles: [scanner]
    image: clamav/clamav:stable@sha256:6d87c712e3391e13c1ba6e05dfb074d4b1ddb5a6834b23bb9da990d2a4ef042a

  web:
    build:
      context: web
    image: controlid-hub/web:dev
    depends_on: { api: { condition: service_healthy } }
    ports: ["127.0.0.1:8081:8080"]

  worker:
    build:
      context: .
      dockerfile: infra/docker/dotnet.Dockerfile
      args: { PROJECT: Platform.Worker, BASE: aspnet }
    image: controlid-hub/worker:dev
    depends_on: { db-migrate: { condition: service_completed_successfully } }
    environment:
      DOTNET_ENVIRONMENT: Development
      ConnectionStrings__Hub: Host=postgres;Database=hub;Username=worker_import;Password=${HUB_PASSWORD_WORKER_IMPORT};GSS Encryption Mode=Disable
      Kms__Address: http://kms:8200
      Kms__Token: ${HUB_KMS_DEV_TOKEN}
      Storage__ServiceUrl: http://object-storage:9000
      Storage__Bucket: hub-dev
      Storage__AccessKey: ${HUB_S3_ACCESS_KEY}
      Storage__SecretKey: ${HUB_S3_SECRET_KEY}
      # Sem scanner, nada sai da quarentena. Exemplo: docker compose --profile scanner up
      Scanner__Host: ${HUB_SCANNER_HOST:-}

volumes:
  pgdata:
  s3data:
